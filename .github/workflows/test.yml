name: Test DeadmauC

on:
  push:
    branches: [ main, rename-to-deadmauc ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run example programs
      run: |
        echo "Running hello.mau5..."
        node src/index.js examples/hello.mau5

        echo "Running fizzbuzz.mau5..."
        node src/index.js examples/fizzbuzz.mau5

        echo "Running fibonacci.mau5..."
        node src/index.js examples/fibonacci.mau5

        echo "Running countdown.mau5..."
        node src/index.js examples/countdown.mau5

        echo "Running aliases.mau5..."
        node src/index.js examples/aliases.mau5

        echo "All examples ran successfully!"
